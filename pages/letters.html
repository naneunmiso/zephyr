<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Letter | Muskan</title>
  <link
    href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Dancing+Script:wght@500;700&family=Inter:wght@300;400;500;600&family=Manrope:wght@300;400;500&display=swap"
    rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>
  <style>
    :root {
      --accent: #c87de8;
      --bg: #07000f;
      --text: #f0e8f8;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      font-family: 'Cormorant Garamond', serif;
      overflow-x: hidden;
    }

    /* ═══════════════════════════════════
       PASSCODE OVERLAY — soft white/sky
    ═══════════════════════════════════ */
    #passcode-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #e8f4fb 0%, #f0f8ff 40%, #fdf6ff 70%, #e4f0f8 100%);
      overflow: hidden;
    }

    /* Fix: orb divs must be absolutely positioned so they don't disrupt flex centering */
    .orb {
      position: absolute !important;
      pointer-events: none;
      border-radius: 50%;
      filter: blur(70px);
      animation: blobDrift ease-in-out infinite alternate;
    }

    .orb1 {
      width: 460px;
      height: 460px;
      background: rgba(176, 224, 245, .5);
      top: -100px;
      left: -120px;
      animation-duration: 9s;
    }

    .orb2 {
      width: 380px;
      height: 380px;
      background: rgba(210, 225, 255, .45);
      bottom: -80px;
      right: -100px;
      animation-duration: 12s;
      animation-delay: 2s;
    }

    .orb3 {
      width: 280px;
      height: 280px;
      background: rgba(245, 220, 255, .35);
      top: 40%;
      left: 60%;
      animation-duration: 10s;
      animation-delay: 1s;
    }

    /* soft floating blobs */
    .pc-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      pointer-events: none;
      animation: blobDrift ease-in-out infinite alternate;
    }

    .pc-blob1 {
      width: 420px;
      height: 420px;
      background: rgba(176, 224, 245, .45);
      top: -80px;
      left: -100px;
      animation-duration: 9s;
    }

    .pc-blob2 {
      width: 340px;
      height: 340px;
      background: rgba(210, 230, 255, .4);
      bottom: -60px;
      right: -80px;
      animation-duration: 12s;
      animation-delay: 2s;
    }

    .pc-blob3 {
      width: 260px;
      height: 260px;
      background: rgba(240, 220, 255, .3);
      top: 45%;
      left: 55%;
      animation-duration: 10s;
      animation-delay: 1s;
    }

    @keyframes blobDrift {
      0% {
        transform: translate(0, 0)scale(1);
      }

      100% {
        transform: translate(24px, 16px)scale(1.06);
      }
    }

    /* tiny dust particles */
    .pc-dust {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      animation: dustFloat ease-in-out infinite;
    }

    @keyframes dustFloat {

      0%,
      100% {
        opacity: .25;
        transform: translateY(0);
      }

      50% {
        opacity: .7;
        transform: translateY(-12px);
      }
    }

    /* card */
    .pc-card {
      position: relative;
      z-index: 10;
      background: linear-gradient(160deg, rgba(255, 255, 255, .88) 0%, rgba(245, 250, 255, .78) 100%);
      border: 1px solid rgba(180, 215, 245, .65);
      border-top: 2px solid rgba(220, 240, 255, .95);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border-radius: 28px;
      padding: 3rem 2.8rem 2.6rem;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, .8),
        0 24px 70px rgba(100, 160, 220, .2),
        0 8px 24px rgba(100, 160, 220, .1),
        inset 0 1px 0 rgba(255, 255, 255, .95);
      animation: cardIn .85s cubic-bezier(.34, 1.46, .64, 1) forwards;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(36px)scale(.92);
      }

      to {
        opacity: 1;
        transform: translateY(0)scale(1);
      }
    }

    /* decorative top accent */
    .pc-card::before {
      content: '💌  ✨  💌';
      position: absolute;
      top: -1.1rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.1rem;
      letter-spacing: 8px;
      white-space: nowrap;
    }

    .pc-icon {
      font-size: 2.8rem;
      margin-bottom: .6rem;
      animation: iconFloat 4s ease-in-out infinite;
      filter: drop-shadow(0 4px 16px rgba(100, 160, 220, .35));
    }

    @keyframes iconFloat {

      0%,
      100% {
        transform: translateY(0) rotate(-2deg);
      }

      50% {
        transform: translateY(-8px) rotate(2deg);
      }
    }

    .pc-title {
      font-family: 'EB Garamond', 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-weight: 400;
      font-style: italic;
      color: #1e3a5f;
      margin: 0 0 .3rem;
      line-height: 1.2;
      background: linear-gradient(135deg, #2d4a6b 0%, #4a7fa8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .pc-sub {
      font-family: 'Inter', sans-serif;
      font-size: .65rem;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: rgba(70, 110, 150, .5);
      margin-bottom: 2rem;
    }

    .pc-digits {
      display: flex;
      justify-content: center;
      margin-bottom: 1.6rem;
      width: 100%;
    }

    .pc-text-input {
      width: 100%;
      height: 54px;
      background: rgba(230, 244, 255, .65);
      border: 1.5px solid rgba(150, 195, 230, .5);
      border-radius: 14px;
      color: #1a3550;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      letter-spacing: 6px;
      text-align: center;
      outline: none;
      caret-color: #4ba8d4;
      transition: border-color .25s, box-shadow .3s, background .25s, transform .2s;
      -webkit-appearance: none;
      appearance: none;
      padding: 0 18px;
      box-shadow: 0 2px 8px rgba(100, 170, 220, .1);
    }

    .pc-text-input:focus {
      border-color: rgba(80, 165, 215, .8);
      background: rgba(215, 238, 255, .9);
      box-shadow: 0 0 0 4px rgba(80, 165, 215, .18), 0 4px 16px rgba(80, 165, 215, .15);
      transform: translateY(-1px);
    }

    .pc-text-input::placeholder {
      color: rgba(80, 130, 170, .3);
      letter-spacing: 3px;
      font-size: .84rem;
    }

    .shake {
      animation: shake .5s forwards;
    }

    @keyframes shake {

      10%,
      90% {
        transform: translateX(-4px);
      }

      20%,
      80% {
        transform: translateX(6px);
      }

      30%,
      50%,
      70% {
        transform: translateX(-6px);
      }

      40%,
      60% {
        transform: translateX(6px);
      }
    }

    .pc-err {
      font-family: 'Cormorant Garamond', serif;
      font-size: .88rem;
      font-style: italic;
      color: #b05070;
      min-height: 1.6rem;
      margin-bottom: .6rem;
      opacity: 0;
      transition: opacity .3s;
      line-height: 1.4;
    }

    .pc-err.on {
      opacity: 1;
    }

    .pc-hint {
      font-family: 'Inter', sans-serif;
      font-size: .68rem;
      letter-spacing: 1.5px;
      color: rgba(90, 150, 190, .6);
      margin-top: .3rem;
      opacity: 0;
      transition: opacity .4s .1s;
      font-style: normal;
      text-transform: uppercase;
    }

    .pc-hint.on {
      opacity: 1;
    }

    .pc-btn {
      width: 100%;
      padding: .9rem;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, #6db8d8 0%, #a0c8e8 40%, #7faade 100%);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: .72rem;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(90, 165, 215, .4), inset 0 1px 0 rgba(255, 255, 255, .5);
      transition: transform .2s cubic-bezier(.34, 1.56, .64, 1), box-shadow .25s, filter .2s;
      font-weight: 600;
      position: relative;
      overflow: hidden;
    }

    .pc-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, .25) 0%, rgba(255, 255, 255, 0) 60%);
      border-radius: inherit;
    }

    .pc-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 36px rgba(90, 165, 215, .55);
      filter: brightness(1.05);
    }

    .pc-btn:active {
      transform: translateY(0);
    }

    .pc-btn:disabled {
      opacity: .35;
      cursor: default;
      transform: none;
    }

    .pc-ok {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 24px;
      background: rgba(235, 248, 255, .92);
      opacity: 0;
      pointer-events: none;
      transition: opacity .5s;
    }

    .pc-ok.on {
      opacity: 1;
      pointer-events: all;
    }

    .pc-ok-icon {
      font-size: 3.2rem;
      animation: pop .6s cubic-bezier(.34, 1.56, .64, 1) forwards;
    }

    @keyframes pop {
      from {
        transform: scale(0)rotate(-20deg);
        opacity: 0;
      }

      to {
        transform: scale(1)rotate(0);
        opacity: 1;
      }
    }

    .pc-ok-txt {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      font-style: italic;
      color: #2d4a6b;
      margin-top: .9rem;
      animation: fadeUp .6s .3s both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #passcode-overlay.exit {
      animation: ovExit .9s 1.4s cubic-bezier(.7, 0, 1, 1) forwards;
    }

    @keyframes ovExit {
      0% {
        opacity: 1;
        transform: scale(1);
      }

      100% {
        opacity: 0;
        transform: scale(1.06);
        pointer-events: none;
      }
    }

    /* sparkles star layer */
    .star {
      position: absolute;
      border-radius: 50%;
      background: rgba(120, 180, 220, .8);
      animation: sparkleAnim ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes sparkleAnim {

      0%,
      100% {
        opacity: 0;
        transform: scale(0.4);
      }

      50% {
        opacity: 0.8;
        transform: scale(1.2);
      }
    }

    /* ═══════════════════════════════════
       MAIN CONTENT — vertical scroll
    ═══════════════════════════════════ */
    #content {
      opacity: 0;
      transition: opacity 1s ease;
    }

    #content.on {
      opacity: 1;
    }

    /* scroll reveal for book sections — animated via GSAP ScrollTrigger */
    .song-section .song-pdf-side {
      opacity: 0;
      transform: translateX(-40px);
    }

    .song-section .song-note-side {
      opacity: 0;
      transform: translateX(40px);
    }

    /* back button */
    #back {
      position: fixed;
      top: 18px;
      left: 20px;
      z-index: 200;
      font-family: 'Inter', sans-serif;
      font-size: .7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(220, 190, 240, .6);
      text-decoration: none;
      padding: 8px 16px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 20px;
      background: rgba(7, 0, 15, .6);
      backdrop-filter: blur(12px);
      transition: color .2s, background .2s, border-color .2s;
    }

    #back:hover {
      color: #e8d4ff;
      background: rgba(140, 40, 200, .25);
      border-color: rgba(200, 120, 255, .4);
    }

    /* ═══════════════════════════════════
       PAGE SECTION — each PDF page
    ═══════════════════════════════════ */
    .book-section {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 60px 16px 40px;
      position: relative;
      opacity: 0;
      transform: translateY(40px);
    }

    /* canvas rendered from pdf.js */
    .pdf-canvas-wrap {
      width: 100%;
      max-width: 860px;
      position: relative;
    }

    .pdf-canvas-wrap canvas {
      width: 100% !important;
      height: auto !important;
      display: block;
      border-radius: 6px;
      box-shadow: 0 20px 80px rgba(0, 0, 0, .6), 0 4px 20px rgba(0, 0, 0, .4);
    }

    /* loading skeleton */
    .pdf-loading {
      width: 100%;
      aspect-ratio: 3/4;
      background: linear-gradient(110deg, #1a0a2e 30%, #2d1050 50%, #1a0a2e 70%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
    }

    @keyframes shimmer {
      0% {
        background-position: 200% 0;
      }

      100% {
        background-position: -200% 0;
      }
    }

    /* ═══════════════════════════════════
       WRITABLE PAGES (5-8)
    ═══════════════════════════════════ */
    .write-section {
      width: 100%;
      max-width: 860px;
      position: relative;
    }

    .write-section canvas {
      width: 100% !important;
      height: auto !important;
      display: block;
      border-radius: 6px;
      box-shadow: 0 20px 80px rgba(0, 0, 0, .6);
    }

    .write-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      padding: 10% 14%;
      font-family: 'Dancing Script', cursive;
      font-size: clamp(15px, 2.5vw, 22px);
      color: #2c1a0e;
      line-height: 2.1;
      z-index: 2;
      caret-color: #5a2e10;
      overflow: hidden;
    }

    .write-overlay::placeholder {
      color: rgba(44, 26, 14, .3);
    }

    .write-page-num {
      position: absolute;
      bottom: 2%;
      right: 4%;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(.6rem, 1.2vw, .8rem);
      letter-spacing: 3px;
      color: rgba(44, 26, 14, .35);
      pointer-events: none;
      z-index: 3;
    }

    /* ═══════════════════════════════════
       PHOTO COLLAGE PAGE (9)
    ═══════════════════════════════════ */
    .collage-wrapper {
      width: 100%;
      max-width: 860px;
    }

    .collage-header {
      width: 100%;
      height: 200px;
      overflow: hidden;
      border-radius: 6px 6px 0 0;
      background: #f5e9d0;
      position: relative;
    }

    .collage-header canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: auto !important;
    }

    /* photo grid */
    .collage-photos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(6px, 1.2vw, 14px);
      padding: clamp(10px, 2vw, 20px);
      background: #f7edd8;
      border-radius: 0 0 6px 6px;
      box-shadow: 0 20px 80px rgba(0, 0, 0, .5);
      overflow: hidden;
    }

    .collage-photos img {
      width: 100%;
      min-width: 0;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      object-position: center;
      border-radius: 6px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .3);
      transition: transform .3s ease, box-shadow .3s ease;
      display: block;
    }

    .collage-photos img:hover {
      transform: scale(1.04);
      box-shadow: 0 8px 30px rgba(0, 0, 0, .5);
    }


    /* ═══════════════════════════════════
       FIXED PROGRESS BAR
    ═══════════════════════════════════ */
    #prog-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      width: 0%;
      background: linear-gradient(90deg, #7040c8, #c87de8 50%, #5080e8);
      z-index: 300;
      transition: width .1s linear;
      box-shadow: 0 0 12px rgba(140, 60, 220, .5);
      border-radius: 0 2px 2px 0;
    }

    /* ═══════════════════════════════════
       PAGE 10 — SONG SPLIT LAYOUT
    ═══════════════════════════════════ */
    .song-section {
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 60px 16px 60px;
    }

    .song-card {
      width: 100%;
      max-width: 920px;
      background: #fffdf7;
      border-radius: 8px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .55), 0 6px 24px rgba(0, 0, 0, .3);
      display: flex;
      flex-direction: row;
      overflow: hidden;
      min-height: 540px;
    }

    .song-pdf-side {
      width: 45%;
      flex-shrink: 0;
      border-right: 1px solid rgba(44, 26, 14, .12);
      background: #faf6ee;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      position: relative;
    }

    .song-pdf-side .pdf-canvas-wrap {
      max-width: 100%;
    }

    .song-pdf-side .pdf-canvas-wrap canvas {
      box-shadow: 0 8px 30px rgba(0, 0, 0, .2) !important;
    }

    .song-note-side {
      width: 55%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 44px;
      background: #fffdf7;
    }

    .song-note-text {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(1.05rem, 2vw, 1.35rem);
      color: #2c1a0e;
      line-height: 1.9;
      letter-spacing: 0.01em;
    }

    .song-note-text p {
      margin-bottom: 1.1em;
    }

    .song-note-text p:last-child {
      margin-bottom: 0;
    }

    .song-note-text .note-opening {
      font-size: clamp(1.2rem, 2.4vw, 1.6rem);
      font-weight: 700;
      margin-bottom: 1.4em;
      color: #1e0e04;
    }

    .song-note-text .note-signature {
      margin-top: 1.6em;
      font-size: clamp(1rem, 1.8vw, 1.25rem);
      color: rgba(44, 26, 14, .65);
      font-style: italic;
    }

    .song-note-text .note-birthday {
      font-size: clamp(1.15rem, 2.2vw, 1.5rem);
      font-weight: 700;
      color: #2c1a0e;
    }

    @media (max-width: 768px) {
      .book-section {
        min-height: auto;
        padding: 30px 10px;
      }

      .song-section {
        min-height: auto;
        padding: 30px 8px;
      }

      .forever-section {
        min-height: auto;
        padding: 30px 10px 60px;
      }

      .song-card {
        flex-direction: row;
        min-height: unset;
        align-items: stretch;
      }

      .song-pdf-side {
        width: 44%;
        border-right: 1px solid rgba(44, 26, 14, .08);
        border-top: none;
        padding: 16px 12px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .song-pdf-side .pdf-canvas-wrap {
        width: 100%;
        max-width: 200px;
        margin: 0 auto;
      }

      .song-pdf-side .pdf-canvas-wrap canvas {
        width: 100% !important;
        height: auto !important;
        display: block;
        margin: 0 auto;
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12) !important;
      }

      .song-note-side {
        width: 56%;
        padding: 24px 16px 24px 12px;
        display: flex;
        align-items: center;
      }

      .song-note-text {
        font-size: clamp(0.72rem, 2.8vw, 1.05rem);
        line-height: 1.6;
      }

      .song-note-text p {
        margin-bottom: 0.7em;
      }

      .song-note-text .note-opening {
        font-size: clamp(0.9rem, 3.5vw, 1.25rem);
        margin-bottom: 0.8em;
      }

      .song-note-text .note-birthday {
        font-size: clamp(0.85rem, 3vw, 1.15rem);
      }

      .song-note-text .note-signature {
        margin-top: 0.9em;
        font-size: clamp(0.75rem, 2.8vw, 1.05rem);
      }
    }

    /* ═══════════════════════════════════
       PAGE 11 — FOREVER — clean
    ═══════════════════════════════════ */
    .forever-section {
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 60px 16px 80px;
    }

    /* ═══════════════════════════════════
       RESPONSIVE
    ═══════════════════════════════════ */
    @media (max-width: 600px) {
      .book-section {
        padding: 52px 10px 30px;
      }

      .write-overlay {
        padding: 10% 10%;
        font-size: clamp(11px, 2.5vw, 22px);
      }

      .pc-card {
        padding: 2.2rem 1.4rem 1.8rem;
      }

      .pc-title {
        font-size: 1.6rem;
      }

      .pc-sub {
        margin-bottom: 1.4rem;
      }
    }
  </style>
</head>

<body>

  <!-- PASSCODE -->
  <div id="passcode-overlay">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
    <div class="pc-card" id="pc-card">
      <div class="pc-icon">💌</div>
      <h2 class="pc-title">Birthday Letter</h2>
      <p class="pc-sub">Enter your passcode</p>
      <div class="pc-digits">
        <input class="pc-text-input" type="password" id="pc-text" autocomplete="off" placeholder="passcode"
          spellcheck="false">
      </div>
      <p class="pc-err" id="pc-err">Incorrect passcode — try again</p>
      <button class="pc-btn" id="pc-btn" onclick="checkCode()">Open ✦</button>
      <div class="pc-ok" id="pc-ok">
        <span class="pc-ok-icon">🌸</span>
        <p class="pc-ok-txt">Opening your letter…</p>
      </div>
    </div>
  </div>

  <!-- PROGRESS BAR -->
  <div id="prog-bar"></div>

  <!-- BACK -->
  <a href="../index.html" id="back">← Back</a>

  <!-- MAIN CONTENT -->
  <div id="content">
    <!-- Pages rendered here by JS -->
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    /* ──────────────────────────────────
       LENIS SMOOTH SCROLLING
    ────────────────────────────────── */
    let lenis = null;
    if (typeof Lenis !== 'undefined') {
      lenis = new Lenis({
        duration: 1.2,
        easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
        orientation: 'vertical',
        gestureOrientation: 'vertical',
        smoothWheel: true,
        wheelMultiplier: 1.15
      });

      function raf(time) {
        if (lenis) lenis.raf(time);
        requestAnimationFrame(raf);
      }
      requestAnimationFrame(raf);

      // Start with lenis stopped because of passcode screen
      lenis.stop();
    }

    /* ──────────────────────────────────
       PASSCODE
    ────────────────────────────────── */
    const ov = document.getElementById('passcode-overlay');
    for (let i = 0; i < 70; i++) {
      const s = document.createElement('div'); s.className = 'star';
      s.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 100}%;animation-duration:${2 + Math.random() * 4}s;animation-delay:${Math.random() * 5}s;width:${Math.random() < .3 ? 3 : 2}px;height:${Math.random() < .3 ? 3 : 2}px;opacity:${.1 + Math.random() * .4};`;
      ov.appendChild(s);
    }
    const pcInput = document.getElementById('pc-text');
    const CODE = 'kushu';
    if (pcInput) {
      pcInput.addEventListener('keydown', e => { if (e.key === 'Enter') checkCode(); });
      setTimeout(() => pcInput.focus(), 600);
    }

    function checkCode() {
      const v = (pcInput ? pcInput.value.trim() : '');
      if (!v) return;
      if (v === CODE) {
        document.getElementById('pc-btn').disabled = true;
        document.getElementById('pc-ok').classList.add('on');
        ov.classList.add('exit');
        setTimeout(() => { ov.style.display = 'none'; startBook(); }, 2400);
      } else {
        const c = document.getElementById('pc-card'), e = document.getElementById('pc-err');
        c.classList.add('shake'); e.classList.add('on');
        if (pcInput) { pcInput.style.borderColor = 'rgba(255,80,100,.7)'; pcInput.style.background = 'rgba(255,80,100,.1)'; }
        setTimeout(() => {
          c.classList.remove('shake');
          if (pcInput) { pcInput.value = ''; pcInput.style.borderColor = ''; pcInput.style.background = ''; pcInput.focus(); }
          setTimeout(() => e.classList.remove('on'), 2000);
        }, 600);
      }
    }
    window.checkCode = checkCode;

    /* ──────────────────────────────────
       PDF RENDERING
    ────────────────────────────────── */
    const DPR = Math.min(window.devicePixelRatio || 1, 2);

    async function renderPDF(url, container, opts = {}) {
      const skel = document.createElement('div');
      skel.className = 'pdf-loading';
      container.appendChild(skel);

      try {
        const pdf = await pdfjsLib.getDocument(url).promise;
        const pageNums = opts.pages || [1];

        for (const pNum of pageNums) {
          const page = await pdf.getPage(pNum);
          const viewport = page.getViewport({ scale: 1 });
          const containerW = (container.parentElement
            ? container.parentElement.clientWidth || window.innerWidth
            : window.innerWidth);
          const maxW = Math.min(containerW - 32, opts.maxWidth || 860);

          let scale;
          if (opts.maxHeight) {
            const scaleH = (opts.maxHeight * DPR) / viewport.height;
            const scaleW = (maxW * DPR) / viewport.width;
            scale = Math.min(scaleH, scaleW);
          } else {
            scale = (maxW * DPR) / viewport.width;
          }

          const vp = page.getViewport({ scale });
          const canvas = document.createElement('canvas');
          canvas.width = vp.width;
          canvas.height = vp.height;
          canvas.style.width = (vp.width / DPR) + 'px';
          canvas.style.height = (vp.height / DPR) + 'px';

          await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
          container.appendChild(canvas);
        }
        skel.remove();
      } catch (err) {
        skel.remove();
        const errDiv = document.createElement('div');
        errDiv.style.cssText = 'color:rgba(200,100,100,.7);padding:40px;text-align:center;font-size:.9rem;';
        errDiv.textContent = 'Could not load page';
        container.appendChild(errDiv);
        console.warn('PDF render error:', url, err);
      }
    }

    /* ──────────────────────────────────
       BOOK BUILDER
    ────────────────────────────────── */
    const PAGES = [
      { type: 'pdf', src: '/letter/Front page (1).pdf', label: 'Front Page' },
      { type: 'pdf', src: '/letter/pages.pdf', label: 'Page 2' },
      { type: 'pdf', src: '/letter/third page camelia (1).pdf', label: 'Page 3' },
      { type: 'pdf', src: '/letter/second page (1).pdf', label: 'Page 4' },
      { type: 'write', src: '/letter/letter pages (1).pdf', page: 1, key: 'lp5', label: 'Page 5', ph: '' },
      { type: 'write', src: '/letter/letter pages (1).pdf', page: 1, key: 'lp6', label: 'Page 6', ph: '' },
      { type: 'write', src: '/letter/letter pages (1).pdf', page: 1, key: 'lp7', label: 'Page 7', ph: '' },
      { type: 'write', src: '/letter/letter pages (1).pdf', page: 1, key: 'lp8_v2', label: 'Page 8', ph: "i don't know what to write just happy birthday >3" },
      {
        type: 'collage', src: '/letter/Beige Doodle Fun Fashion Magazine Cover (1).pdf', label: 'Page 9',
        photos: [
          '/letter/WhatsApp Image 2026-06-24 at 12.33.54.jpeg',
          '/letter/WhatsApp Image 2026-06-24 at 12.33.54 (1).jpeg',
          '/letter/WhatsApp Image 2026-06-24 at 12.33.59.jpeg',
        ]
      },
      { type: 'song', src: '/letter/song.pdf', label: 'Page 10' },
      { type: 'forever', src: '/letter/Forever (1).pdf', label: 'Page 11' },
    ];

    async function startBook() {
      const content = document.getElementById('content');
      content.classList.add('on');

      for (let i = 0; i < PAGES.length; i++) {
        const p = PAGES[i];

        /* ── Standard PDF page ── */
        if (p.type === 'pdf') {
          const section = document.createElement('div');
          section.className = 'book-section';
          section.id = 'pg' + (i + 1);
          const wrap = document.createElement('div');
          wrap.className = 'pdf-canvas-wrap';
          section.appendChild(wrap);
          content.appendChild(section);
          observeRender(wrap, () => renderPDF(p.src, wrap));
        }

        /* ── Writable letter pages ── */
        else if (p.type === 'write') {
          const section = document.createElement('div');
          section.className = 'book-section';
          section.id = 'pg' + (i + 1);

          const wrap = document.createElement('div');
          wrap.className = 'write-section pdf-canvas-wrap';
          wrap.style.position = 'relative';

          const ta = document.createElement('textarea');
          ta.className = 'write-overlay';
          ta.placeholder = p.ph;
          ta.dataset.k = p.key;
          let saved = localStorage.getItem(p.key);
          if (!saved || saved.trim() === "" || saved.includes("i don't know what to write just happy birthday >3")) {
            if (p.key === 'lp8_v2') {
              saved = "\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\ni don't know what to write just happy birthday >3";
              localStorage.setItem(p.key, saved);
            } else {
              saved = "";
              localStorage.setItem(p.key, saved);
            }
          }
          ta.value = saved;
          ta.addEventListener('input', () => localStorage.setItem(p.key, ta.value));

          const lbl = document.createElement('span');
          lbl.className = 'write-page-num';
          lbl.textContent = '✦ ' + (i - 3) + ' / 4';

          section.appendChild(wrap);
          content.appendChild(section);
          observeRender(wrap, async () => {
            await renderPDF(p.src, wrap, { pages: [p.page] });
            wrap.appendChild(ta);
            wrap.appendChild(lbl);
            const cv = wrap.querySelector('canvas');
            if (cv) {
              ta.style.height = cv.style.height || cv.offsetHeight + 'px';
              new ResizeObserver(() => { ta.style.height = cv.offsetHeight + 'px'; }).observe(cv);
            }
          });
        }

        /* ── Photo collage page 9 ── */
        else if (p.type === 'collage') {
          const section = document.createElement('div');
          section.className = 'book-section';
          section.id = 'pg' + (i + 1);

          const wrap = document.createElement('div');
          wrap.className = 'collage-wrapper pdf-canvas-wrap';

          const header = document.createElement('div');
          header.className = 'collage-header';

          const grid = document.createElement('div');
          grid.className = 'collage-photos';
          p.photos.forEach(src => {
            const img = document.createElement('img');
            img.src = src; img.alt = 'memory'; img.loading = 'lazy';
            grid.appendChild(img);
          });

          wrap.appendChild(header);
          wrap.appendChild(grid);
          section.appendChild(wrap);
          content.appendChild(section);

          observeRender(header, async () => {
            await renderPDF(p.src, header, { maxHeight: 200 });
          });
        }

        /* ── Song page 10 — split layout ── */
        else if (p.type === 'song') {
          const section = document.createElement('div');
          section.className = 'song-section book-section';
          section.id = 'pg' + (i + 1);

          const card = document.createElement('div');
          card.className = 'song-card';

          // Left: PDF
          const pdfSide = document.createElement('div');
          pdfSide.className = 'song-pdf-side';
          const pdfWrap = document.createElement('div');
          pdfWrap.className = 'pdf-canvas-wrap';
          pdfSide.appendChild(pdfWrap);

          // Right: handwritten note
          const noteSide = document.createElement('div');
          noteSide.className = 'song-note-side';
          const noteText = document.createElement('div');
          noteText.className = 'song-note-text';
          noteText.innerHTML = `
          <p class="note-opening">For you, always.</p>
          <p>Some songs find you at the right moment —<br>when the words are too much,<br>and silence isn't enough.</p>
          <p>This one felt like you.</p>
          <p>So I saved it here,<br>between the last page and forever,<br>as a reminder that you are<br>someone worth writing songs about.</p>
          <p class="note-birthday">Happy Birthday, Muskan.</p>
          <p class="note-signature">— with love, always ♡</p>
        `;
          noteSide.appendChild(noteText);

          card.appendChild(pdfSide);
          card.appendChild(noteSide);
          section.appendChild(card);
          content.appendChild(section);

          observeRender(pdfWrap, () => renderPDF(p.src, pdfWrap, { maxWidth: 380 }));
        }

        /* ── Forever page 11 — clean render ── */
        else if (p.type === 'forever') {
          const section = document.createElement('div');
          section.className = 'forever-section book-section';
          section.id = 'pg' + (i + 1);

          const wrap = document.createElement('div');
          wrap.className = 'pdf-canvas-wrap';
          section.appendChild(wrap);
          content.appendChild(section);
          observeRender(wrap, () => renderPDF(p.src, wrap));
        }
      } // end for loop

      // Start Lenis when the book is unlocked and connect it to ScrollTrigger
      if (lenis) {
        lenis.start();
        lenis.on('scroll', ScrollTrigger.update);
        lenis.on('scroll', ({ progress }) => {
          document.getElementById('prog-bar').style.width = (progress * 100).toFixed(2) + '%';
        });
      } else {
        // Fallback scroll listener for progress bar
        window.addEventListener('scroll', () => {
          const h = document.documentElement;
          const pct = h.scrollTop / (h.scrollHeight - h.clientHeight) * 100;
          document.getElementById('prog-bar').style.width = pct + '%';
        }, { passive: true });
      }

      // Scroll reveal animations via GSAP ScrollTrigger
      setTimeout(() => {
        document.querySelectorAll('.book-section').forEach(section => {
          // Create a single timeline for the section to avoid multiple ScrollTriggers and prevent scroll lag
          const tl = gsap.timeline({
            scrollTrigger: {
              trigger: section,
              start: "top 88%",
              toggleActions: "play none none none"
            }
          });

          // Section entrance
          tl.fromTo(section,
            { opacity: 0, y: 40 },
            {
              opacity: 1,
              y: 0,
              duration: 1.1,
              ease: "power3.out"
            }
          );

          // Child components fade reveals inside the timeline
          const canvas = section.querySelector('canvas');
          const overlay = section.querySelector('.write-overlay');
          const label = section.querySelector('.write-page-num');
          const collagePhotos = section.querySelectorAll('.collage-photos img');
          const songPdf = section.querySelector('.song-pdf-side');
          const songNote = section.querySelector('.song-note-side');

          if (canvas) {
            tl.fromTo(canvas,
              { scale: 0.96, opacity: 0 },
              { scale: 1, opacity: 1, duration: 0.95, ease: "power2.out" },
              "-=0.9"
            );
          }

          if (overlay) {
            tl.fromTo(overlay,
              { opacity: 0 },
              { opacity: 1, duration: 0.9 },
              "-=0.6"
            );
          }

          if (label) {
            tl.fromTo(label,
              { opacity: 0, y: 10 },
              { opacity: 1, y: 0, duration: 0.8 },
              "-=0.6"
            );
          }

          if (collagePhotos.length > 0) {
            tl.fromTo(collagePhotos,
              { opacity: 0, scale: 0.8, y: 30 },
              {
                opacity: 1,
                scale: 1,
                y: 0,
                duration: 0.85,
                stagger: 0.08,
                ease: "power2.out"
              },
              "-=0.8"
            );
          }

          if (songPdf && songNote) {
            tl.fromTo(songPdf,
              { opacity: 0, x: -30 },
              { opacity: 1, x: 0, duration: 1.1, ease: "power3.out" },
              "-=0.8"
            );
            tl.fromTo(songNote,
              { opacity: 0, x: 30 },
              { opacity: 1, x: 0, duration: 1.1, ease: "power3.out" },
              "-=1.1"
            );
          }
        });
      }, 200);

    } // end startBook

    // IntersectionObserver for lazy PDF rendering
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting && e.target._renderFn) {
          e.target._renderFn();
          io.unobserve(e.target);
          delete e.target._renderFn;
        }
      });
    }, { rootMargin: '300px' });

    function observeRender(el, fn) {
      el._renderFn = fn;
      io.observe(el);
    }
  </script>
  <!-- GSAP ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script>gsap.registerPlugin(ScrollTrigger);</script>
</body>

</html>
